name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies by design - the validator uses only node: builtins,
      # so this stays fast and cannot break on a transitive update.
      - name: Validate plugin structure
        run: node scripts/validate.mjs

      # The Stop gate is now a script, so CI can actually test it. This runs
      # easyClaude's own .claude/verify.json - which runs the validator again,
      # deliberately: the point is to prove verify.mjs itself works on Linux.
      - name: Verify contract passes
        run: node scripts/verify.mjs

      # The half that matters. A gate that never blocks is the failure nobody
      # notices, so assert the hook exits 2 on a contract that fails. The temp
      # directory is not a git repo, which also covers "cannot tell what changed
      # -> run the contract anyway".
      - name: Stop gate blocks a failing contract
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/.claude"
          echo '{"steps":[{"name":"fails","cmd":"exit 1"}]}' > "$tmp/.claude/verify.json"
          set +e
          echo '{}' | CLAUDE_PROJECT_DIR="$tmp" node scripts/verify.mjs --hook >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::Stop gate exited $code on a failing contract, expected 2 (block)"
            exit 1
          fi
          echo "gate blocked as expected"

      # Tiering is a way to make the gate quieter, so the risk is that it makes it
      # silent. Both halves are asserted: the hook must hold a full-tier step back,
      # and a full run must still catch it.
      - name: Tiers hold back and catch the same failure
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/.claude"
          cat > "$tmp/.claude/verify.json" <<'JSON'
          { "steps": [
            { "name": "quick", "cmd": "true" },
            { "name": "slow",  "cmd": "exit 1", "tier": "full" }
          ] }
          JSON
          set +e
          echo '{}' | CLAUDE_PROJECT_DIR="$tmp" node scripts/verify.mjs --hook >/dev/null 2>&1
          hook=$?
          (cd "$tmp" && node "$GITHUB_WORKSPACE/scripts/verify.mjs" >/dev/null 2>&1)
          full=$?
          set -e
          if [ "$hook" -ne 0 ]; then
            echo "::error::Stop gate exited $hook; a full-tier step must not block a turn (expected 0)"
            exit 1
          fi
          if [ "$full" -ne 1 ]; then
            echo "::error::full run exited $full; a failing full-tier step must still fail (expected 1)"
            exit 1
          fi
          echo "fast tier allowed the turn, full run caught the failure"

      # The repo is checked out with LF via .gitattributes. If a diff appears
      # here, something was committed with line endings that bypassed it.
      - name: Check line endings survived checkout
        run: |
          if git diff --exit-code --stat; then
            echo "working tree clean"
          else
            echo "::error::checkout produced a diff - line endings or filters are misconfigured"
            exit 1
          fi
