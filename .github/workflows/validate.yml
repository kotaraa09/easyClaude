name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    # Windows is not a nice-to-have here. connect.mjs carries a whole code path for it -
    # the .cmd shim that execFile cannot launch, exit code 9009, and the % and " guard on
    # the cmd.exe fallback - and none of it ran in CI until now. A comment inside
    # validate.mjs already said a Windows path bug "passes anyway in Linux CI". It did.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # bash on both, so one copy of every step covers both platforms. windows-latest ships
    # Git Bash, which converts a /c/... argument to C:\... on the way into node - so a path
    # captured with pwd works unchanged on either side.
    defaults:
      run:
        shell: bash

    steps:
      # All history, for the release tags: update-check.mjs installs the last release and
      # updates it to this commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No dependencies by design - every script here uses only node: builtins, so this
      # stays fast and cannot break on a transitive update.
      - name: Validate plugin structure
        run: node scripts/validate.mjs

      # validate.mjs checks hooks.json against rules this repo wrote. Up to 0.1.2 those rules
      # described the wrong shape, and Claude Code loaded zero hooks with every check green.
      # This asks the real binary what it loads. Unpinned on purpose: the question is whether
      # the version users install today accepts the plugin. `plugin details` needs no login.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Claude Code's own checker, next to ours. validate.mjs checks rules this repo wrote,
      # and those rules were wrong once already (see above). This one moves with each
      # release: MCP entries that load would drop, unquoted plugin paths in hooks, fields
      # the manifest no longer accepts. On a directory it reads the marketplace, so the
      # plugin manifest is named as well.
      - name: Claude Code's own plugin checks
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json

      - name: Claude Code loads every hook
        run: node scripts/load-check.mjs --require

      # load-check.mjs loads this folder with --plugin-dir, which no user does. 1.2.0 passed it
      # and failed to load for everyone who updated from 1.1.x. This installs it fresh, and
      # updates the last release to it, each in a config folder of its own.
      - name: Claude Code loads it after a fresh install and after an update
        run: node scripts/update-check.mjs --require

      # The suite that checks the checking machinery. This used to be roughly three hundred
      # lines of bash living in this file, which meant nobody could run it while editing the
      # thing it covers: a check that had stopped checking was only ever found after a push,
      # by reading the source. Four separate times, that is how it was found.
      #
      # It is a normal script now, so `node scripts/test.mjs` runs the same tests on a
      # laptop that run here. It breaks a copy of the tree one thing at a time and requires
      # the validator to notice, it pins the gate's behaviour, and it fails when any check
      # in validate.mjs has no test at all.
      - name: Test the checking machinery
        run: node scripts/test.mjs

      # The gate running easyClaude's own contract, on this platform. Fast tier only: the
      # full tier of that contract is the suite above, which has just run.
      - name: Verify contract passes
        run: |
          node scripts/verify.mjs --trust
          node scripts/verify.mjs --fast

      # The repo is checked out with LF via .gitattributes. If a diff appears here,
      # something was committed with line endings that bypassed it - and this runs on
      # Windows too, where a mangled checkout is most likely to happen.
      - name: Check line endings survived checkout
        run: |
          if git diff --exit-code --stat; then
            echo "working tree clean"
          else
            echo "::error::checkout produced a diff - line endings or filters are misconfigured"
            exit 1
          fi
